<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>25</title>

    <!-- Open Graph / iMessage-Slack-Twitter link preview. `og:image` must be
         an absolute URL (crawlers don't resolve relative ones against the
         page) — swap the URL below if this ever moves off this domain/path.
         Edit the copy freely; none of it affects the password gate itself. -->
    <meta property="og:title" content="25" />
    <meta property="og:description" content="the birthday party invitation" />
    <meta property="og:image" content="https://elijahsorensen.com/25/og-image.jpg" />
    <meta property="og:url" content="https://elijahsorensen.com/25/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style id="gate-style">
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: 'JetBrains Mono', monospace;
        background: #0b0b0c;
        color: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
        max-width: 280px;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      input {
        font: inherit;
        padding: 0.6rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #444;
        background: #1a1a1c;
        color: inherit;
      }

      button {
        font: inherit;
        padding: 0.6rem 0.75rem;
        border-radius: 0.5rem;
        border: none;
        background: #f5f5f5;
        color: #0b0b0c;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .error {
        color: #ff6b6b;
        font-size: 0.85rem;
        min-height: 1.1em;
      }
    </style>
  </head>
  <body>
    <form id="gate">
      <input id="password" type="password" placeholder="password" autocomplete="off" autofocus />
      <button type="submit">enter</button>
      <div class="error" id="error"></div>
    </form>
    <script src="./loader.js"></script>
  </body>
</html>
